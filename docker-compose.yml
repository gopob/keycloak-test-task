# Local Keycloak for the demo SPA.
# Starts in dev mode and imports ./keycloak/realm-export.json on first boot,
# which provisions: realm `myrealm`, public client `react-spa` (PKCE S256),
# realm role `app-user`, and two test users (see README).
#
#   docker compose up -d        # start
#   docker compose down         # stop (keeps nothing - dev mode is in-memory)
#
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: keycloak-demo
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
